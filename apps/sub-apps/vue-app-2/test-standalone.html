<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue App 2 独立测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f2f5;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .test-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e8e8e8;
        }
        .test-info {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .error-info {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 20px;
            color: #ff4d4f;
        }
        #vue-file-management {
            min-height: 600px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>Vue App 2 (文件管理) 独立测试</h1>
            <p>测试异步组件加载和路由切换功能</p>
        </div>
        
        <div class="test-info">
            <h3>测试说明：</h3>
            <ul>
                <li>此页面用于独立测试 Vue App 2 的异步组件加载问题</li>
                <li>检查组件是否能正常导出和渲染</li>
                <li>验证路由切换是否正常工作</li>
                <li>观察是否出现 "Cannot read properties of null (reading 'component')" 错误</li>
            </ul>
        </div>

        <div id="vue-file-management"></div>
    </div>

    <script>
        // 监听错误
        window.addEventListener('error', function(e) {
            console.error('Global Error:', e.error);
            showError('JavaScript Error: ' + e.error.message);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled Promise Rejection:', e.reason);
            showError('Promise Rejection: ' + e.reason.message);
        });

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-info';
            errorDiv.innerHTML = '<h3>检测到错误：</h3><p>' + message + '</p>';
            document.querySelector('.test-container').insertBefore(errorDiv, document.getElementById('vue-file-management'));
        }

        // 加载应用
        console.log('开始加载 Vue App 2...');
    </script>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
